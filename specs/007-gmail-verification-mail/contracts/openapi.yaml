openapi: 3.1.0
info:
  title: AgentFlow Gmail 信箱驗證測試 API
  version: 1.0.0
paths:
  /api/admin/email-verification/send:
    post:
      summary: 由系統管理員寄送 Gmail SMTP 驗證碼測試信
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 160
      responses:
        '200':
          description: 信件已交付 Gmail SMTP
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data, timestamp]
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data:
                    type: object
                    required: [maskedRecipient, sentAt]
                    properties:
                      maskedRecipient: { type: string }
                      sentAt: { type: string, format: date-time }
                  timestamp: { type: string, format: date-time }
        '400': { description: 收件信箱格式錯誤 }
        '401': { description: 尚未登入 }
        '403': { description: 非系統管理員 }
        '502': { description: Gmail SMTP 寄送失敗 }
        '503': { description: Gmail SMTP 尚未設定 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
