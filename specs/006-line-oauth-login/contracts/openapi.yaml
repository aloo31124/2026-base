openapi: 3.1.0
info:
  title: AgentFlow LINE OAuth API
  version: 1.0.0
paths:
  /api/auth/line/authorize:
    get:
      summary: 建立 OAuth attempt 並取得 LINE v2.1 授權網址
      responses:
        '200':
          description: 授權網址建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        '503': { description: LINE Login 尚未設定 }
  /api/auth/line/callback:
    post:
      summary: 驗證 callback、建立或載入使用者並簽發 AgentFlow JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: LINE 登入成功
        '400': { description: callback 缺少必要資料或使用者拒絕 }
        '401': { description: state 無效、逾時或已使用 }
        '502': { description: LINE token 或 ID token 驗證失敗 }
components:
  schemas:
    AuthorizeResponse:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    CallbackRequest:
      type: object
      required: [state]
      properties:
        code: { type: string }
        state: { type: string }
        error: { type: string }
        errorDescription: { type: string }
