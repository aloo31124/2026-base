spring:
  datasource:
    url: jdbc:h2:mem:agentflow;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    root: WARN
    com.agentflow: INFO

app:
  mail:
    mock-enabled: true
    test-code: "123456"
  line-oauth:
    mock-enabled: true
    callback-url: http://localhost:5173/api/auth/line/callback
    mock-provider-base-url: http://localhost:8080
