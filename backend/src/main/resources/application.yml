server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agentflow-base
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=base_20260716_01;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:base_20260716_01}
    password: ${DB_PASSWORD:base_20260716_01}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Taipei
  jackson:
    time-zone: Asia/Taipei

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:agentflow-base-2026-jwt-secret-must-have-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  line-oauth:
    channel-id: ${LINE_CHANNEL_ID:2009072345}
    channel-secret: ${LINE_CHANNEL_SECRET:381bb438d2c973636d712aaf6ea99909}
    callback-url: ${LINE_CALLBACK_URL:https://base-client-316015752010.asia-east1.run.app/api/auth/line/callback}
    mock-enabled: ${LINE_OAUTH_MOCK_ENABLED:false}
    mock-provider-base-url: ${LINE_OAUTH_MOCK_PROVIDER_BASE_URL:http://localhost:8080}
    attempt-ttl-minutes: ${LINE_OAUTH_ATTEMPT_TTL_MINUTES:10}

logging:
  config: classpath:logback-spring.xml
