<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編輯工作流｜AgentFlow</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="app-header"><a class="brand" href="index.html"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><path d="M5 7.5 12 3l7 4.5v9L12 21l-7-4.5Z"/><path d="m5 7.5 7 4.5 7-4.5M12 12v9"/></svg></span><span class="brand-copy">AgentFlow</span></a><div class="header-search"><select><option>工作流</option><option>代理</option></select><input placeholder="搜尋名稱、標籤或負責人…"></div><div class="header-actions"><button class="icon-btn mobile-menu-btn" data-sidebar-toggle><svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="icon-btn" data-theme-toggle></button><div class="user-chip"><span class="avatar">YL</span><span class="user-copy"><strong>Yuna Lin</strong><small>Workspace Admin</small></span></div></div></header>
<aside class="sidebar"><button class="icon-btn sidebar-toggle" data-sidebar-toggle><svg class="icon" viewBox="0 0 24 24"><path d="m14 18-6-6 6-6"/></svg></button><ul class="nav-list"><li><a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span class="nav-copy">總覽儀表板</span></a></li><li><a class="nav-item active" href="workflow-list.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h4a4 4 0 0 0 4-4V6M7 12h4a4 4 0 0 1 4 4v2"/></svg><span class="nav-copy">工作流管理</span></a></li><li><a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM5 21a7 7 0 0 1 14 0"/></svg><span class="nav-copy">代理成員</span></a></li><li><a class="nav-item" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg><span class="nav-copy">執行與監控</span></a></li></ul></aside>
<main class="app-main"><nav class="page-tabs"><a class="tab" href="workflow-list.html">工作流列表</a><a class="tab active" href="workflow-edit.html">新增／編輯</a><a class="tab" href="#">版本紀錄</a><a class="tab" href="#">權限設定</a></nav><div class="content"><header class="page-heading"><div><div class="eyebrow">Workflow editor</div><h1>編輯工作流</h1><p class="muted">設定任務目標、執行代理與輸出規則。</p></div><span class="status draft">草稿</span></header>
<form class="card form-card"><section class="form-section"><header class="section-heading"><h2>基本資訊</h2><p class="muted">讓團隊快速理解這個工作流的用途。</p></header><div class="form-grid"><div class="field"><label for="name">工作流名稱 <span class="required">*</span></label><input class="control" id="name" value="客戶意見分類"></div><div class="field"><label for="team">負責團隊</label><select class="control" id="team"><option>客服中心</option><option>產品營運</option></select></div><div class="field full"><label for="description">工作流說明</label><textarea class="control" id="description">自動彙整客服管道的客戶意見，分析情緒並依主題分派給對應團隊。</textarea></div></div></section>
<section class="form-section"><header class="section-heading"><h2>代理與執行設定</h2><p class="muted">指定負責代理、觸發方式與人工審核機制。</p></header><div class="form-grid"><div class="field"><label>主要代理</label><select class="control"><option>Feedback Analyst</option><option>Research Agent</option></select></div><div class="field"><label>觸發方式</label><select class="control"><option>每 30 分鐘自動執行</option><option>手動執行</option><option>Webhook</option></select></div><div class="field"><label>失敗重試次數</label><input class="control" type="number" value="3"></div><div class="field"><label>單次逾時</label><select class="control"><option>10 分鐘</option><option>30 分鐘</option></select></div><div class="field full"><label>人工審核</label><div class="switch-row"><button class="switch" type="button" role="switch" aria-checked="true"></button><span>發布結果前需由負責人確認</span></div></div></div></section>
<section class="form-section"><header class="section-heading"><h2>輸出設定</h2><p class="muted">定義完成後的資料去向與通知方式。</p></header><div class="form-grid"><div class="field"><label>輸出目的地</label><select class="control"><option>客戶洞察資料庫</option><option>電子郵件摘要</option></select></div><div class="field"><label>通知對象</label><input class="control" value="cx-team@agentflow.tw"></div></div></section><footer class="form-actions"><a class="btn btn-secondary" href="workflow-list.html">取消</a><button class="btn btn-secondary" type="button">儲存草稿</button><button class="btn btn-primary" type="submit">儲存並啟用</button></footer></form></div></main><script src="app.js"></script></body></html>
